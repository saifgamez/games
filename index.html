<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Game 🚀</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    background:#050505;color:white;font-family:Arial,Tahoma,sans-serif;
    min-height:100vh;overflow-x:hidden
}
body::before{
    content:"";position:fixed;inset:0;
    background:
    radial-gradient(circle at 15% 20%,rgba(0,150,255,.08),transparent 25%),
    radial-gradient(circle at 85% 70%,rgba(160,0,255,.07),transparent 25%);
    pointer-events:none;z-index:-1
}
header{padding:25px 15px 15px;text-align:center}
.logo{
    font-size:38px;font-weight:900;letter-spacing:1px;
    text-shadow:0 0 15px rgba(255,255,255,.25);
    animation:logoIn .8s ease
}
.logo span{display:inline-block;animation:controller 2.5s ease-in-out infinite}
.subtitle{color:#999;margin-top:8px}

.searchBox{max-width:1100px;margin:25px auto;padding:0 15px}
.searchRow{display:flex;gap:10px;align-items:center}
.searchInputWrap{flex:1}
.searchBox input{
    width:100%;padding:17px 20px;border-radius:15px;border:1px solid #252525;
    outline:none;background:#111;color:white;font-size:16px;transition:.3s;
    box-shadow:0 0 0 transparent
}
.searchBox input:focus{
    border-color:#555;box-shadow:0 0 25px rgba(255,255,255,.08);
    transform:translateY(-2px)
}
.filterBtn{
    min-width:125px;height:54px;padding:0 16px;border-radius:15px;
    border:1px solid #252525;background:#111;color:white;font-size:15px;
    font-weight:bold;cursor:pointer;transition:.3s
}
.filterBtn:hover,.filterBtn.active{
    background:#fff;color:#000;border-color:#fff;transform:translateY(-2px)
}

#favoriteMenu{
    display:none;margin-top:12px;background:#101010;border:1px solid #252525;
    border-radius:15px;padding:15px
}
#favoriteMenu.active{display:block}
.favoriteItem{
    background:#181818;border:1px solid #292929;border-radius:12px;
    padding:12px 15px;margin-bottom:8px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;transition:.3s
}
.favoriteItem:last-child{margin-bottom:0}
.favoriteItem:hover{background:#222;border-color:#444}
.favoriteItemName{
    display:flex;align-items:center;gap:10px;font-weight:bold;min-width:0
}
.favoriteItemName span:last-child{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.favoriteItemActions{
    display:flex;align-items:center;gap:8px;flex-shrink:0
}
.favoriteOpenBtn{
    padding:8px 12px;border-radius:9px;border:1px solid #333;
    background:#111;color:white;cursor:pointer;transition:.3s
}
.favoriteOpenBtn:hover{background:white;color:black}
.favoriteRemoveBtn{
    width:38px;height:38px;border-radius:9px;border:1px solid #665500;
    background:#211d00;color:#ffd000;cursor:pointer;font-size:18px;transition:.3s
}
.favoriteRemoveBtn:hover{background:#ffd000;color:#000}

.filterMenu{
    display:none;margin-top:12px;background:#101010;border:1px solid #252525;
    border-radius:15px;padding:15px;gap:10px;flex-wrap:wrap
}
.filterMenu.active{display:flex}
.filterOption{
    padding:10px 15px;border-radius:10px;border:1px solid #292929;
    background:#181818;color:white;cursor:pointer;transition:.3s;font-size:14px
}
.filterOption:hover,.filterOption.selected{
    background:white;color:black;border-color:white
}

.container{width:min(1200px,94%);margin:auto}
.sectionTitle{margin:30px 0 18px;font-size:25px}
.sectionTitle span{color:#777;font-size:14px}

.grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.card{
    position:relative;overflow:hidden;background:linear-gradient(145deg,#151515,#0c0c0c);
    border:1px solid #222;border-radius:20px;padding:23px;min-height:220px;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s;
    animation:cardIn .55s ease both
}
.card::before{
    content:"";position:absolute;width:180px;height:180px;right:-80px;top:-90px;
    background:rgba(255,255,255,.08);filter:blur(35px);transition:.5s
}
.card::after{
    content:"";position:absolute;top:0;left:-120%;width:70%;height:100%;
    transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    transition:.7s
}
.card:hover{
    transform:translateY(-9px) scale(1.015);border-color:#444;
    box-shadow:0 15px 45px rgba(0,0,0,.7),0 0 25px rgba(255,255,255,.07)
}
.card:hover::before{transform:scale(1.5);opacity:.8}
.card:hover::after{left:140%}
.emoji{
    font-size:48px;display:inline-block;transition:.4s;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.12))
}
.card:hover .emoji{transform:translateY(-5px) rotate(-4deg) scale(1.12)}
.card h3{font-size:21px;margin-top:15px}
.card p{color:#888;margin-top:7px;font-size:14px}
.btn{
    margin-top:18px;width:100%;padding:12px;border:0;border-radius:12px;
    background:#fff;color:#000;font-weight:bold;cursor:pointer;position:relative;
    overflow:hidden;transition:.3s
}
.btn::after{
    content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:rgba(255,255,255,.7);transform:skewX(-25deg);transition:.5s
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,255,255,.12)}
.btn:hover::after{left:130%}

#searchResults{display:none;margin-top:25px}
.empty{
    background:#111;border:1px solid #222;border-radius:15px;
    padding:25px;text-align:center;color:#888
}

.page{display:none;animation:pageIn .45s ease}
.page.active{display:block}
.backBtn{
    margin:20px 0;background:#171717;border:1px solid #292929;color:white;
    padding:12px 20px;border-radius:12px;cursor:pointer;transition:.3s
}
.backBtn:hover{background:#222;transform:translateX(4px)}

.detailHeader{
    background:linear-gradient(145deg,#151515,#090909);
    border:1px solid #252525;border-radius:22px;padding:30px;margin-bottom:20px
}
.detailHeader .bigEmoji{font-size:70px}
.detailHeader h1{margin-top:12px;font-size:32px}
.infoBox{
    background:#101010;border:1px solid #222;border-radius:18px;
    padding:22px;margin:18px 0
}
.infoBox h2{margin-bottom:12px}
.infoBox p{color:#bbb;line-height:1.8}

.gameCard{
    background:#101010;border:1px solid #222;border-radius:16px;padding:18px;
    margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;
    gap:15px;transition:.3s
}
.gameCard:hover{border-color:#444;transform:translateX(-5px);background:#151515}
.gameInfo{flex:1;min-width:0}
.gameInfo h3{margin-bottom:7px}
.gameInfo p{color:#777;font-size:14px}
.gameActions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.smallBtn{
    white-space:nowrap;padding:10px 15px;border-radius:10px;border:1px solid #333;
    background:#181818;color:white;cursor:pointer;transition:.3s
}
.smallBtn:hover{background:#fff;color:#000}

.favoriteBtn{
    width:44px;height:44px;border-radius:11px;border:1px solid #333;
    background:#181818;color:#777;font-size:21px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.3s;
    flex-shrink:0;position:relative;z-index:5
}
.favoriteBtn:hover{background:#252525;color:#fff;transform:scale(1.06)}
.favoriteBtn.active{
    color:#ffd000;border-color:#665500;background:#211d00;
    text-shadow:0 0 12px rgba(255,208,0,.45)
}

.detailGameTop{
    display:flex;align-items:center;justify-content:space-between;gap:20px
}
.detailGameTitle{flex:1;min-width:0}
.rating{font-size:25px;margin:10px 0}
.videoBtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
.videoBtn{
    text-decoration:none;color:white;background:#181818;border:1px solid #303030;
    padding:12px 16px;border-radius:12px;transition:.3s
}
.videoBtn:hover{background:#252525;transform:translateY(-3px)}

.comments{margin:35px 0}
.commentForm{display:flex;gap:10px;margin-top:15px}
.commentForm input{
    flex:1;background:#111;color:white;border:1px solid #252525;
    border-radius:12px;padding:13px;outline:none
}
.commentForm button{
    background:white;color:black;border:0;border-radius:12px;
    padding:0 20px;font-weight:bold;cursor:pointer
}
.comment{
    background:#111;border:1px solid #222;padding:15px;border-radius:12px;
    margin-top:10px;animation:commentIn .3s ease
}
.catalogCount{
    color:#777;font-size:14px;margin-top:-10px;margin-bottom:20px
}
footer{text-align:center;color:#666;padding:40px 15px;margin-top:40px}

@keyframes logoIn{
    from{opacity:0;transform:translateY(-20px) scale(.9)}
    to{opacity:1;transform:none}
}
@keyframes controller{
    0%,100%{transform:rotate(0)}
    50%{transform:rotate(5deg) translateY(-3px)}
}
@keyframes cardIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
}
@keyframes pageIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:none}
}
@keyframes commentIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:none}
}

@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
    .searchRow{flex-wrap:wrap}
    .searchInputWrap{flex:100%}
    .filterBtn{flex:1;min-width:0}
}
@media(max-width:600px){
    .logo{font-size:30px}
    .grid{grid-template-columns:1fr}
    .card{min-height:190px}
    .gameCard{flex-direction:column;align-items:stretch}
    .gameActions{width:100%;justify-content:space-between}
    .smallBtn{flex:1}
    .favoriteBtn{width:46px}
    .detailGameTop{align-items:flex-start}
    .commentForm{flex-direction:column}
    .commentForm button{padding:12px}
    .favoriteItem{align-items:stretch;flex-direction:column}
    .favoriteItemActions{width:100%}
    .favoriteOpenBtn{flex:1}
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        transition-duration:.01ms!important
    }
}

/* =====================================================
   DARK / LIGHT MODE + ANIMATED GAMING BACKGROUND
===================================================== */
body{
    --bg:#050505;
    --text:#fff;
    --muted:#999;
    --panel:#101010;
    --panel2:#151515;
    --panel3:#181818;
    --border:#252525;
    --softBorder:#222;
    --button:#fff;
    --buttonText:#000;
    background:var(--bg);
    color:var(--text);
    position:relative;
}
body::before{
    z-index:0;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,150,255,.18),transparent 27%),
        radial-gradient(circle at 85% 70%,rgba(160,0,255,.16),transparent 27%),
        radial-gradient(circle at 50% 110%,rgba(0,255,190,.10),transparent 25%);
    filter:blur(4px);
    animation:bgGlow 12s ease-in-out infinite alternate;
}
body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.45;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:55px 55px;
    mask-image:linear-gradient(to bottom,transparent 0%,black 18%,black 82%,transparent 100%);
    animation:gridMove 12s linear infinite;
}
header,.searchBox,.container,footer{position:relative;z-index:2}

.themeToggle{
    position:absolute;
    top:22px;
    left:20px;
    width:64px;
    height:34px;
    padding:3px;
    border:1px solid #333;
    border-radius:999px;
    background:#111;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:.35s;
    box-shadow:0 5px 20px rgba(0,0,0,.3),0 0 18px rgba(0,150,255,.08);
    z-index:10;
}
.themeToggle .themeIcon{
    position:absolute;
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    color:#111;
    font-size:15px;
    transition:.35s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.themeToggle .sun{right:5px;opacity:.45}
.themeToggle .moon{left:5px;opacity:1}
body.light .themeToggle{background:#e9eef7;border-color:#cbd5e1}
body.light .themeToggle .themeIcon{transform:translateX(30px);background:#fff;color:#f59e0b}
body.light .themeToggle .sun{opacity:1}
body.light .themeToggle .moon{opacity:.35}

/* Light theme */
body.light{
    --bg:#eef3f9;
    --text:#111827;
    --muted:#64748b;
    --panel:#ffffff;
    --panel2:#f8fafc;
    --panel3:#eef2f7;
    --border:#cbd5e1;
    --softBorder:#dbe2ea;
    --button:#111827;
    --buttonText:#fff;
    background:var(--bg);
}
body.light::before{
    background:
        radial-gradient(circle at 15% 20%,rgba(0,140,255,.16),transparent 28%),
        radial-gradient(circle at 85% 70%,rgba(145,70,255,.13),transparent 28%),
        radial-gradient(circle at 50% 110%,rgba(0,180,150,.10),transparent 25%);
}
body.light::after{
    opacity:.28;
    background-image:
        linear-gradient(rgba(15,23,42,.07) 1px,transparent 1px),
        linear-gradient(90deg,rgba(15,23,42,.07) 1px,transparent 1px);
}
body.light .subtitle{color:#64748b}
body.light .searchBox input,
body.light .filterBtn,
body.light #favoriteMenu,
body.light .filterMenu,
body.light .favoriteItem,
body.light .filterOption,
body.light .empty,
body.light .backBtn,
body.light .infoBox,
body.light .gameCard,
body.light .smallBtn,
body.light .favoriteBtn,
body.light .videoBtn,
body.light .commentForm input,
body.light .comment{
    background:rgba(255,255,255,.88);
    color:#111827;
    border-color:#cbd5e1;
}
body.light .searchBox input::placeholder,
body.light .card p,
body.light .gameInfo p,
body.light .infoBox p,
body.light .empty,
body.light .catalogCount,
body.light footer{color:#64748b}
body.light .searchBox input:focus{border-color:#64748b;box-shadow:0 0 25px rgba(0,100,200,.12)}
body.light .filterBtn:hover,
body.light .filterBtn.active,
body.light .filterOption:hover,
body.light .filterOption.selected{
    background:#111827;color:#fff;border-color:#111827
}
body.light .card,
body.light .detailHeader{
    background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(241,245,249,.92));
    border-color:#cbd5e1;
    box-shadow:0 15px 40px rgba(15,23,42,.08)
}
body.light .card:hover{border-color:#94a3b8;box-shadow:0 15px 45px rgba(15,23,42,.14),0 0 25px rgba(0,120,255,.08)}
body.light .card::before{background:rgba(0,120,255,.08)}
body.light .card::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.05),transparent)}
body.light .btn,
body.light .commentForm button{background:#111827;color:#fff}
body.light .btn:hover{box-shadow:0 8px 25px rgba(15,23,42,.15)}
body.light .btn::after{background:rgba(255,255,255,.25)}
body.light .backBtn:hover,
body.light .gameCard:hover,
body.light .smallBtn:hover,
body.light .videoBtn:hover{background:#e2e8f0;color:#111827}
body.light .favoriteOpenBtn{background:#f1f5f9;color:#111827;border-color:#cbd5e1}
body.light .favoriteOpenBtn:hover{background:#111827;color:#fff}
body.light .favoriteRemoveBtn{background:#fff8cc}
body.light .favoriteItem:hover{background:#f1f5f9;border-color:#94a3b8}
body.light .favoriteBtn{color:#64748b}
body.light .favoriteBtn:hover{background:#e2e8f0;color:#111827}
body.light .favoriteBtn.active{background:#fff8cc;color:#b45309;border-color:#eab308}

@keyframes bgGlow{
    0%{transform:scale(1) translate3d(0,0,0)}
    50%{transform:scale(1.06) translate3d(1%, -1%, 0)}
    100%{transform:scale(1.12) translate3d(-1%, 1%, 0)}
}

/* ===== PREMIUM REALISTIC SPACE BACKGROUND ===== */
.space-bg{
    position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 110%,rgba(42,74,150,.18),transparent 50%),
      radial-gradient(ellipse at 10% 20%,rgba(88,44,180,.12),transparent 34%),
      radial-gradient(ellipse at 90% 70%,rgba(20,105,190,.10),transparent 32%),
      #01030a;
}
.space-bg .stars,.space-bg .stars::before,.space-bg .stars::after{
    position:absolute;inset:-20%;content:"";background-repeat:repeat;
    background-image:
      radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.5px),
      radial-gradient(circle,rgba(180,220,255,.70) 0 1px,transparent 1.6px),
      radial-gradient(circle,rgba(255,255,255,.50) 0 .7px,transparent 1.3px);
    background-size:145px 145px,230px 230px,95px 95px;
    background-position:10px 20px,80px 60px,30px 90px;
    opacity:.52;will-change:transform;
}
.space-bg .stars::before{opacity:.30;transform:scale(1.25)}
.space-bg .stars::after{opacity:.18;transform:scale(1.55)}
.galaxy{
    position:absolute;width:420px;height:250px;border-radius:50%;opacity:.22;
    filter:blur(1px);transform:rotate(-22deg);will-change:transform;
    background:
      radial-gradient(ellipse at center,rgba(255,255,255,.95) 0 1%,rgba(190,150,255,.65) 4%,rgba(105,100,235,.32) 13%,rgba(40,90,190,.13) 30%,transparent 68%),
      repeating-radial-gradient(ellipse at center,transparent 0 12px,rgba(160,115,255,.11) 15px 20px,transparent 24px 37px);
    box-shadow:0 0 110px rgba(100,80,255,.22);
}
.galaxy::after{content:"";position:absolute;inset:35% 4%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);filter:blur(13px)}
.galaxy.one{top:-80px;right:-110px}
.galaxy.two{bottom:-130px;left:-120px;width:500px;height:300px;opacity:.16;transform:rotate(25deg)}
.planet{position:absolute;border-radius:50%;will-change:transform;transform:translate3d(0,0,0)}
.planet::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 23%,rgba(255,255,255,.22),transparent 13%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.58) 100%);mix-blend-mode:screen;opacity:.72}
.planet-a{
    width:105px;height:105px;top:17%;left:7%;
    background:
      radial-gradient(ellipse at 58% 45%,transparent 0 35%,rgba(65,150,80,.68) 36% 41%,transparent 43%),
      radial-gradient(ellipse at 35% 65%,rgba(55,135,72,.72) 0 10%,transparent 12%),
      radial-gradient(ellipse at 67% 28%,rgba(66,145,76,.65) 0 9%,transparent 12%),
      repeating-linear-gradient(8deg,rgba(255,255,255,.07) 0 4px,rgba(20,75,135,.08) 5px 10px),
      radial-gradient(circle at 34% 27%,#65b9ec,#2779b9 38%,#125087 62%,#061a37 86%);
    box-shadow:inset -18px -14px 28px rgba(0,0,0,.68),inset 7px 5px 14px rgba(255,255,255,.12),0 0 42px rgba(50,135,230,.30);
}
.planet-a::before{content:"";position:absolute;inset:8%;border-radius:50%;background:repeating-linear-gradient(-18deg,transparent 0 12px,rgba(255,255,255,.10) 13px 16px,transparent 17px 27px);filter:blur(2px);opacity:.75}
.planet-b{
    width:70px;height:70px;top:62%;right:11%;
    background:
      repeating-linear-gradient(12deg,rgba(255,220,170,.20) 0 5px,rgba(110,65,38,.16) 6px 10px,rgba(220,180,125,.13) 11px 14px),
      radial-gradient(circle at 34% 26%,#e6b979,#ad7447 40%,#603522 67%,#21100b 91%);
    box-shadow:inset -15px -10px 20px rgba(0,0,0,.72),inset 6px 5px 12px rgba(255,240,200,.10),0 0 30px rgba(230,160,85,.24);
}
.planet-b::before{content:"";position:absolute;width:170%;height:42%;left:-35%;top:29%;border:7px solid rgba(214,178,122,.38);border-left-color:rgba(110,82,57,.55);border-right-color:rgba(235,207,166,.28);border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 0 3px rgba(255,225,180,.07),0 0 15px rgba(220,170,100,.12)}
.planet-c{
    width:44px;height:44px;top:38%;right:29%;
    background:
      radial-gradient(circle at 30% 28%,#e7e9ec,#aeb3bb 38%,#707680 68%,#2d3138 100%);
    box-shadow:inset -8px -7px 12px rgba(0,0,0,.65),inset 4px 3px 7px rgba(255,255,255,.12),0 0 18px rgba(180,190,205,.16);
}
.planet-c::before{content:"";position:absolute;width:8px;height:6px;border-radius:50%;background:rgba(45,48,54,.35);top:24%;left:25%;box-shadow:15px 10px 0 2px rgba(45,48,54,.25),-3px 17px 0 1px rgba(45,48,54,.27),12px 25px 0 1px rgba(45,48,54,.18)}
.ring{position:absolute;width:155%;height:42%;left:-27%;top:28%;border:2px solid rgba(240,210,160,.50);border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 8px rgba(255,205,135,.20)}
body.light .space-bg{opacity:.48;background:radial-gradient(ellipse at 50% 45%,rgba(90,135,220,.12),transparent 48%),linear-gradient(180deg,#edf4fc,#f7faff)}
body.light .space-bg .stars{opacity:.22}
body.light .galaxy{opacity:.09}
body.light .planet{opacity:.28}

/* ===== PREMIUM THEME SWITCH ===== */
.themeToggle{
    position:relative;width:78px;height:40px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px;

    return {
        name,
        emoji,
        genre,
        aliases:aliases || [name.toLowerCase()],
        description,
        games:[[game,year,platforms,description]]
    };
}

/* =====================================================

===================================================== */

const FAVORITES_KEY="saifGamesFavorites";

function getFavorites(){
    try{
        const data=JSON.parse(localStorage.getItem(FAVORITES_KEY)||"[]");
        return Array.isArray(data)?data:[];
    }catch(error){
        return [];
    }
}

function saveFavorites(favorites){
    localStorage.setItem(FAVORITES_KEY,JSON.stringify(favorites));
}

function getGameFavoriteKey(seriesName,gameName){
    return seriesName+"||"+gameName;
}

function isFavorite(seriesName,gameName){
    return getFavorites().includes(
        getGameFavoriteKey(seriesName,gameName)
    );
}

function toggleFavorite(seriesName,gameName){

    const favorites=getFavorites();
    const key=getGameFavoriteKey(seriesName,gameName);
    const index=favorites.indexOf(key);

    if(index===-1) favorites.push(key);
    else favorites.splice(index,1);

    saveFavorites(favorites);

    updateFavoriteButtons(seriesName,gameName);
    renderFavorites();
}

function updateFavoriteButtons(seriesName,gameName){

    const active=isFavorite(seriesName,gameName);

    document.querySelectorAll(".favoriteBtn").forEach(button=>{

        if(
            button.dataset.favoriteSeries===seriesName &&
            button.dataset.favoriteGame===gameName
        ){
            button.classList.toggle("active",active);
            button.textContent=active?"★":"☆";
            button.title=active?"إزالة من المفضلة":"إضافة للمفضلة";
        }

    });

    const currentFavoriteBtn=document.getElementById("gameFavoriteBtn");

    if(
        currentFavoriteBtn &&
        currentSeries &&
        currentSeries.name===seriesName &&
        currentGameIndex!==null &&
        currentSeries.games[currentGameIndex] &&
        currentSeries.games[currentGameIndex][0]===gameName
    ){
        currentFavoriteBtn.classList.toggle("active",active);
        currentFavoriteBtn.textContent=active?"★":"☆";
        currentFavoriteBtn.title=active?"إزالة من المفضلة":"إضافة للمفضلة";
    }
}

function toggleCurrentGameFavorite(){

    if(!currentSeries||currentGameIndex===null)return;

    const game=currentSeries.games[currentGameIndex];

    toggleFavorite(currentSeries.name,game[0]);
}

function renderFavorites(){

    const favorites=getFavorites();

    favoritesList.innerHTML="";

    if(favorites.length===0){
        favoritesList.innerHTML=
        `<div class="empty">⭐ مفيش ألعاب في المفضلة لسه</div>`;
        return;
    }

    let valid=0;

    favorites.forEach(key=>{

        const separator=key.indexOf("||");

        if(separator===-1)return;

        const seriesName=key.substring(0,separator);
        const gameName=key.substring(separator+2);

        const series=seriesData.find(s=>s.name===seriesName);

        if(!series)return;

        const gameIndex=series.games.findIndex(
            game=>game[0]===gameName
        );

        if(gameIndex===-1)return;

        valid++;

        const item=document.createElement("div");
        item.className="favoriteItem";

        const nameDiv=document.createElement("div");
        nameDiv.className="favoriteItemName";

        const emoji=document.createElement("span");
        emoji.textContent=series.emoji;

        const name=document.createElement("span");
        name.textContent=gameName;

        nameDiv.appendChild(emoji);
        nameDiv.appendChild(name);

        const actions=document.createElement("div");
        actions.className="favoriteItemActions";

        const openBtn=document.createElement("button");
        openBtn.className="favoriteOpenBtn";
        openBtn.type="button";
        openBtn.textContent="التفاصيل";

        openBtn.onclick=()=>{
            openFavoriteGame(seriesName,gameIndex);
        };

        const removeBtn=document.createElement("button");
        removeBtn.className="favoriteRemoveBtn";
        removeBtn.type="button";
        removeBtn.textContent="★";
        removeBtn.title="إزالة من المفضلة";

        removeBtn.onclick=()=>{
            toggleFavorite(seriesName,gameName);
        };

        actions.appendChild(openBtn);
        actions.appendChild(removeBtn);

        item.appendChild(nameDiv);
        item.appendChild(actions);

        favoritesList.appendChild(item);
    });

    if(valid===0){
        favoritesList.innerHTML=
        `<div class="empty">⭐ مفيش ألعاب في المفضلة لسه</div>`;
    }
}

function renderRecommended(){

    recommendedGrid.innerHTML="";

    recommendedNames.forEach(name=>{

        const series=seriesData.find(s=>s.name===name);

        if(!series)return;
        if(!seriesPassesFilters(series))return;

        recommendedGrid.innerHTML+=`
            <div class="card">
                <div>
                    <div class="emoji">${series.emoji}</div>
                    <h3>${escapeHTML(series.name)}</h3>
                    <p>${escapeHTML(series.description)}</p>
                </div>

                <button
                    class="btn"
                    onclick="openSeries('${escapeQuotes(series.name)}')">
                    التفاصيل
                </button>
            </div>
        `;
    });

    if(!recommendedGrid.innerHTML){
        recommendedGrid.innerHTML=
        `<div class="empty">❌ مفيش ألعاب مطابقة للفلاتر</div>`;
    }
}

function seriesPassesFilters(series){

    const genreMatch=
        selectedGenre==="all"||
        series.genre===selectedGenre;

    const platformMatch=
        selectedPlatform==="all"||
        series.games.some(game=>
            platformMatches(game[2],selectedPlatform)
        );

    return genreMatch&&platformMatch;
}

function platformMatches(platforms,selected){

    const text=platforms.toLowerCase();

    if(selected==="PC")return text.includes("pc");

    if(selected==="PlayStation")
        return text.includes("playstation")||text.includes("ps");

    if(selected==="Xbox")
        return text.includes("xbox");

    if(selected==="Nintendo")
        return text.includes("nintendo")||
               text.includes("switch")||
               text.includes("gamecube");

    if(selected==="Mobile")
        return text.includes("mobile");

    return true;
}

/* =====================================================
   البحث
===================================================== */

const searchInput=document.getElementById("searchInput");
const searchResults=document.getElementById("searchResults");
const resultsGrid=document.getElementById("resultsGrid");

function performSearch(){

    const value=normalize(searchInput.value);

    const hasFilter=
        selectedPlatform!=="all"||
        selectedGenre!=="all";

    if(!value&&!hasFilter){

        recommendedGrid.style.display="grid";
        searchResults.style.display="none";
        resultsGrid.innerHTML="";

        renderRecommended();
        return;
    }

    recommendedGrid.style.display="none";

    const results=[];

    seriesData.forEach(series=>{

        if(!seriesPassesFilters(series))return;

        const seriesMatch=
            normalize(series.name).includes(value)||
            series.aliases.some(alias=>
                normalize(alias).includes(value)
            );

        if(seriesMatch){
            results.push({
                type:"series",
                series
            });
        }

        series.games.forEach((game,index)=>{

            const platformMatch=
                selectedPlatform==="all"||
                platformMatches(game[2],selectedPlatform);

            const genreMatch=
                selectedGenre==="all"||
                series.genre===selectedGenre;

            if(
                normalize(game[0]).includes(value)&&
                platformMatch&&
                genreMatch
            ){
                results.push({
                    type:"game",
                    series,
                    index,
                    game
                });
            }
        });
    });

    searchResults.style.display="block";

    if(results.length===0){

        resultsGrid.innerHTML=
        `<div class="empty">❌ مفيش نتائج لحد دلوقتي</div>`;

        return;
    }

    resultsGrid.innerHTML="";

    results.forEach(result=>{

        if(result.type==="series"){

            resultsGrid.innerHTML+=`
                <div class="card">

                    <div>
                        <div class="emoji">${result.series.emoji}</div>

                        <h3>${escapeHTML(result.series.name)}</h3>

                        <p>
                            🎮 سلسلة —
                            ${result.series.games.length}
                            ${result.series.games.length===1?"لعبة":"أجزاء"}
                        </p>
                    </div>

                    <button
                        class="btn"
                        onclick="openSeries('${escapeQuotes(result.series.name)}')">
                        تفاصيل السلسلة
                    </button>

                </div>
            `;

        }else{

            const favorite=
                isFavorite(
                    result.series.name,
                    result.game[0]
                );

            resultsGrid.innerHTML+=`
                <div class="card">

                    <div>

                        <div class="emoji">
                            ${result.series.emoji}
                        </div>

                        <div class="detailGameTop">

                            <div class="detailGameTitle">

                                <h3>
                                    ${escapeHTML(result.game[0])}
                                </h3>

                                <p>
                                    ${escapeHTML(result.series.name)}
                                </p>

                            </div>

                            <button
                                class="favoriteBtn ${favorite?"active":""}"
                                type="button"
                                data-favorite-series="${escapeHTML(result.series.name)}"
                                data-favorite-game="${escapeHTML(result.game[0])}"
                                onclick="toggleFavorite(
                                    '${escapeQuotes(result.series.name)}',
                                    '${escapeQuotes(result.game[0])}'
                                )"
                                title="${favorite?"إزالة من المفضلة":"إضافة للمفضلة"}">
                                ${favorite?"★":"☆"}
                            </button>

                        </div>

                    </div>

                    <button
                        class="btn"
                        onclick="openSearchGame(
                            '${escapeQuotes(result.series.name)}',
                            ${result.index}
                        )">
                        تفاصيل اللعبة
                    </button>

                </div>
            `;
        }
    });
}

function loadComments(){

    let comments=[];

    try{
        comments=JSON.parse(
            localStorage.getItem("saifGamesComments")||"[]"
        );

        if(!Array.isArray(comments))comments=[];
    }catch(error){
        comments=[];
    }

    const list=document.getElementById("commentsList");

    list.innerHTML="";

    comments.forEach(comment=>{

        list.innerHTML+=`
            <div class="comment">
                💬 ${escapeHTML(comment)}
            </div>
        `;
    });
}

function addComment(){

    const input=document.getElementById("commentInput");
    const text=input.value.trim();

    if(!text)return;

    let comments=[];

    try{
        comments=JSON.parse(
            localStorage.getItem("saifGamesComments")||"[]"
        );

        if(!Array.isArray(comments))comments=[];
    }catch(error){
        comments=[];
    }

    comments.unshift(text);

    localStorage.setItem(
        "saifGamesComments",
        JSON.stringify(comments)
    );

    input.value="";

    loadComments();
}

/* =====================================================
   HELPERS
===================================================== */

function normalize(text){

    return String(text)
        .toLowerCase()
        .trim()
        .replace(/[أإآ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه");
}

function escapeQuotes(text){

    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

function escapeHTML(text){

    const div=document.createElement("div");

    div.textContent=String(text);

    return div.innerHTML;
}


/* =====================================================
   SPACE PARALLAX
===================================================== */
(function(){
    const layers=document.querySelectorAll('.space-bg .stars,.space-bg .galaxy,.space-bg .planet,.space-bg .planet-d,.space-bg .planet-e,.space-bg .planet-f');
    let mx=0,my=0,cx=0,cy=0;
    function move(x,y){mx=(x/window.innerWidth-.5)*2;my=(y/window.innerHeight-.5)*2}
    window.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')move(e.clientX,e.clientY)},{passive:true});
    window.addEventListener('touchmove',e=>{if(e.touches[0])move(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
    function frame(){
        cx+=(mx-cx)*.035;cy+=(my-cy)*.035;
        layers.forEach((el,i)=>{
            const d=el.classList.contains('planet')?(i%3+.8):(el.classList.contains('galaxy')?.18:.08);
            const x=cx*d*28,y=cy*d*20;
            const rot=el.classList.contains('galaxy')?(el.classList.contains('two')?25:-22):0;
            el.style.transform=`translate3d(${x}px,${y}px,0) rotate(${rot}deg)`;
        });
        requestAnimationFrame(frame);
    }
    frame();
})();
