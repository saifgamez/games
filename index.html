<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,150,255,.08),transparent 25%),
        radial-gradient(circle at 85% 70%,rgba(160,0,255,.07),transparent 25%);
    pointer-events:none;
    z-index:-1;
}

header{
    padding:25px 15px 15px;
    text-align:center;
}

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 0 15px rgba(255,255,255,.25);
    animation:logoIn .8s ease;
}

.logo span{
    display:inline-block;
    animation:controller 2.5s ease-in-out infinite;
}

.subtitle{
    color:#999;
    margin-top:8px;
}

.searchBox{
    max-width:750px;
    margin:25px auto;
    padding:0 15px;
}

.searchBox input{
    width:100%;
    padding:17px 20px;
    border-radius:15px;
    border:1px solid #252525;
    outline:none;
    background:#111;
    color:white;
    font-size:16px;
    transition:.3s;
    box-shadow:0 0 0 transparent;
}

.searchBox input:focus{
    border-color:#555;
    box-shadow:0 0 25px rgba(255,255,255,.08);
    transform:translateY(-2px);
}

.container{
    width:min(1200px,94%);
    margin:auto;
}

.sectionTitle{
    margin:30px 0 18px;
    font-size:25px;
}

.sectionTitle span{
    color:#777;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,#151515,#0c0c0c);
    border:1px solid #222;
    border-radius:20px;
    padding:23px;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        border-color .35s,
        box-shadow .35s;
    animation:cardIn .55s ease both;
}

.card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-80px;
    top:-90px;
    background:rgba(255,255,255,.08);
    filter:blur(35px);
    transition:.5s;
}

.card::after{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;
    transform:skewX(-20deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.08),
        transparent
    );
    transition:.7s;
}

.card:hover{
    transform:translateY(-9px) scale(1.015);
    border-color:#444;
    box-shadow:
        0 15px 45px rgba(0,0,0,.7),
        0 0 25px rgba(255,255,255,.07);
}

.card:hover::before{
    transform:scale(1.5);
    opacity:.8;
}

.card:hover::after{
    left:140%;
}

.emoji{
    font-size:48px;
    display:inline-block;
    transition:.4s;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.12));
}

.card:hover .emoji{
    transform:translateY(-5px) rotate(-4deg) scale(1.12);
}

.card h3{
    font-size:21px;
    margin-top:15px;
}

.card p{
    color:#888;
    margin-top:7px;
    font-size:14px;
}

.btn{
    margin-top:18px;
    width:100%;
    padding:12px;
    border:0;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:.3s;
}

.btn::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:rgba(255,255,255,.7);
    transform:skewX(-25deg);
    transition:.5s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(255,255,255,.12);
}

.btn:hover::after{
    left:130%;
}

#searchResults{
    display:none;
    margin-top:25px;
}

.empty{
    background:#111;
    border:1px solid #222;
    border-radius:15px;
    padding:25px;
    text-align:center;
    color:#888;
}

.page{
    display:none;
    animation:pageIn .45s ease;
}

.page.active{
    display:block;
}

.backBtn{
    margin:20px 0;
    background:#171717;
    border:1px solid #292929;
    color:white;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
}

.backBtn:hover{
    background:#222;
    transform:translateX(4px);
}

.detailHeader{
    background:linear-gradient(145deg,#151515,#090909);
    border:1px solid #252525;
    border-radius:22px;
    padding:30px;
    margin-bottom:20px;
}

.detailHeader .bigEmoji{
    font-size:70px;
}

.detailHeader h1{
    margin-top:12px;
    font-size:32px;
}

.infoBox{
    background:#101010;
    border:1px solid #222;
    border-radius:18px;
    padding:22px;
    margin:18px 0;
}

.infoBox h2{
    margin-bottom:12px;
}

.infoBox p{
    color:#bbb;
    line-height:1.8;
}

.gameCard{
    background:#101010;
    border:1px solid #222;
    border-radius:16px;
    padding:18px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    transition:.3s;
}

.gameCard:hover{
    border-color:#444;
    transform:translateX(-5px);
    background:#151515;
}

.gameInfo h3{
    margin-bottom:7px;
}

.gameInfo p{
    color:#777;
    font-size:14px;
}

.smallBtn{
    white-space:nowrap;
    padding:10px 15px;
    border-radius:10px;
    border:1px solid #333;
    background:#181818;
    color:white;
    cursor:pointer;
    transition:.3s;
}

.smallBtn:hover{
    background:#fff;
    color:#000;
}

.rating{
    font-size:25px;
    margin:10px 0;
}

.videoBtns{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.videoBtn{
    text-decoration:none;
    color:white;
    background:#181818;
    border:1px solid #303030;
    padding:12px 16px;
    border-radius:12px;
    transition:.3s;
}

.videoBtn:hover{
    background:#252525;
    transform:translateY(-3px);
}

.comments{
    margin:35px 0;
}

.commentForm{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.commentForm input{
    flex:1;
    background:#111;
    color:white;
    border:1px solid #252525;
    border-radius:12px;
    padding:13px;
    outline:none;
}

.commentForm button{
    background:white;
    color:black;
    border:0;
    border-radius:12px;
    padding:0 20px;
    font-weight:bold;
    cursor:pointer;
}

.comment{
    background:#111;
    border:1px solid #222;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    animation:commentIn .3s ease;
}

footer{
    text-align:center;
    color:#666;
    padding:40px 15px;
    margin-top:40px;
}

@keyframes logoIn{
    from{
        opacity:0;
        transform:translateY(-20px) scale(.9);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes controller{
    0%,100%{transform:rotate(0)}
    50%{transform:rotate(5deg) translateY(-3px)}
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes commentIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .logo{
        font-size:30px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        min-height:190px;
    }

    .gameCard{
        flex-direction:column;
        align-items:flex-start;
    }

    .smallBtn{
        width:100%;
    }

    .commentForm{
        flex-direction:column;
    }

    .commentForm button{
        padding:12px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

</section>

</main>

const recommendedNames = [
    "FIFA / EA SPORTS FC",
    "PES / eFootball",
    "Grand Theft Auto",
    "Assassin's Creed",
    "Batman",
    "Red Dead",
    "Need for Speed",
    "God of War",
    "Call of Duty",
    "Valorant",
    "League of Legends",
    "Marvel Rivals",
    "LEGO"
];

const recommendedGrid = document.getElementById("recommendedGrid");

function renderRecommended(){

    recommendedGrid.innerHTML = "";

    recommendedNames.forEach(name => {

        const series = seriesData.find(s => s.name === name);

        if(!series) return;

        recommendedGrid.innerHTML += `
            <div class="card">
                <div>
                    <div class="emoji">${series.emoji}</div>
                    <h3>${series.name}</h3>
                    <p>${series.description}</p>
                </div>

                <button class="btn"
                    onclick="openSeries('${escapeQuotes(series.name)}')">
                    التفاصيل
                </button>
            </div>
        `;
    });
}

let currentSeries = null;

function openSeries(name){

    const series = seriesData.find(s => s.name === name);

    if(!series) return;

    currentSeries = series;

    hidePages();

    document.getElementById("seriesPage").classList.add("active");

    document.getElementById("seriesEmoji").textContent = series.emoji;
    document.getElementById("seriesTitle").textContent = series.name;
    document.getElementById("seriesDescription").textContent = series.description;

    const gamesList = document.getElementById("gamesList");

    gamesList.innerHTML = "";

    series.games.forEach((game,index) => {

        gamesList.innerHTML += `
            <div class="gameCard">
                <div class="gameInfo">
                    <h3>${game[0]}</h3>
                    <p>📅 ${game[1]} — 🎮 ${game[2]}</p>
                </div>

                <button
                    class="smallBtn"
                    onclick="openGame(${index})">
                    التفاصيل
                </button>
            </div>
        `;
    });

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function openGame(index){

    const game = currentSeries.games[index];

    hidePages();

    document.getElementById("gamePage").classList.add("active");

    document.getElementById("gameEmoji").textContent =
        currentSeries.emoji;

    document.getElementById("gameTitle").textContent =
        game[0];

    document.getElementById("gameYear").textContent =
        game[1];

    document.getElementById("gamePlatforms").textContent =
        game[2];

    document.getElementById("gameDescription").textContent =
        game[3];

    document.getElementById("gameRating").textContent =
        "⭐ تقييمات ومراجعات اللعبة";

    const query = encodeURIComponent(game[0]);

    document.getElementById("gameplayLink").href =
        "https://www.youtube.com/results?search_query=" +
        query + "+gameplay";

    document.getElementById("reviewLink").href =
        "https://www.youtube.com/results?search_query=" +
        query + "+review";

    document.getElementById("metaLink").href =
        "https://www.metacritic.com/search/" +
        query;

    document.getElementById("sourceLink").href =
        "https://www.google.com/search?q=" +
        query +
        "+official";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

   البحث
===================================================== */

const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const resultsGrid = document.getElementById("resultsGrid");

searchInput.addEventListener("input",function(){

    const value = normalize(this.value);

    if(!value){

        recommendedGrid.style.display = "grid";
        searchResults.style.display = "none";
        resultsGrid.innerHTML = "";

        return;
    }

    recommendedGrid.style.display = "none";

    const results = [];

    seriesData.forEach(series => {

        const seriesMatch =
            normalize(series.name).includes(value) ||
            series.aliases.some(alias =>
                normalize(alias).includes(value)
            );

        if(seriesMatch){
            results.push({
                type:"series",
                series:series
            });
        }

        series.games.forEach((game,index)=>{

            if(normalize(game[0]).includes(value)){

                results.push({
                    type:"game",
                    series:series,
                    index:index,
                    game:game
                });

            }

        });

    });

    searchResults.style.display = "block";

    if(results.length === 0){

        resultsGrid.innerHTML = `
            <div class="empty">
                ❌ مفيش نتائج لحد دلوقتي
            </div>
        `;

        return;
    }

    resultsGrid.innerHTML = "";

    results.forEach(result=>{

        if(result.type === "series"){

            resultsGrid.innerHTML += `
                <div class="card">
                    <div>
                        <div class="emoji">
                            ${result.series.emoji}
                        </div>

                        <h3>${result.series.name}</h3>

                        <p>
                            🎮 سلسلة — ${result.series.games.length} أجزاء
                        </p>
                    </div>

                    <button
                        class="btn"
                        onclick="openSeries('${escapeQuotes(result.series.name)}')">
                        تفاصيل السلسلة
                    </button>
                </div>
            `;

        }else{

            resultsGrid.innerHTML += `
                <div class="card">
                    <div>
                        <div class="emoji">
                            ${result.series.emoji}
                        </div>

                        <h3>${result.game[0]}</h3>

                        <p>
                            ${result.series.name}
                        </p>
                    </div>

                    <button
                        class="btn"
                        onclick="openSearchGame(
                            '${escapeQuotes(result.series.name)}',
                            ${result.index}
                        )">
                        تفاصيل اللعبة
                    </button>
                </div>
            `;

        }

    });

});

function openSearchGame(seriesName,index){

    const series = seriesData.find(
        s => s.name === seriesName
    );

    if(!series) return;

    currentSeries = series;

    openGame(index);
}

function hidePages(){

    document
        .querySelectorAll(".page")
        .forEach(page=>{
            page.classList.remove("active");
        });

}

function goHome(){

    hidePages();

    document
        .getElementById("homePage")
        .classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function backToSeries(){

    if(currentSeries){
        openSeries(currentSeries.name);
    }else{
        goHome();
    }
}

function loadComments(){

    const comments =
        JSON.parse(
            localStorage.getItem("saifGamesComments") || "[]"
        );

    const list =
        document.getElementById("commentsList");

    list.innerHTML = "";

    comments.forEach(comment=>{

        list.innerHTML += `
            <div class="comment">
                💬 ${escapeHTML(comment)}
            </div>
        `;

    });
}

function addComment(){

    const input =
        document.getElementById("commentInput");

    const text =
        input.value.trim();

    if(!text) return;

    const comments =
        JSON.parse(
            localStorage.getItem("saifGamesComments") || "[]"
        );

    comments.unshift(text);

    localStorage.setItem(
        "saifGamesComments",
        JSON.stringify(comments)
    );

    input.value = "";

    loadComments();
}

function normalize(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/[أإآ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه");
}

function escapeQuotes(text){

    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

renderRecommended();
loadComments();
